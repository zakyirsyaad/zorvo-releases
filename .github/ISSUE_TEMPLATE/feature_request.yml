name: Idea
description: Suggest something Zorvo could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Screens or examples are welcome.
  - type: input
    id: agent
    attributes:
      label: Agent
      description: The agent it is about, if any.
      placeholder: Claude Code
