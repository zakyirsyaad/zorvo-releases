name: Bug report
description: Something in Zorvo does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Check [Troubleshooting](https://github.com/zakyirsyaad/zorvo-releases#troubleshooting) first.
        Never paste API keys, tokens or other secrets here. A security problem goes to the [Security tab](https://github.com/zakyirsyaad/zorvo-releases/security) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new session with Codex in a folder
        2. Send a message
        3. ...
    validations:
      required: true
  - type: input
    id: zorvo-version
    attributes:
      label: Zorvo version
      description: Shown at the bottom of the sidebar.
      placeholder: v0.5.1
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.5, Apple Silicon
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and its version
      description: The agent the session used, if the problem is in a session.
      placeholder: Qwen Code 0.25.2
  - type: textarea
    id: details
    attributes:
      label: Screenshots or error text
      description: Remove anything private (paths, project names, secrets) first.
